services:
  api_app:
    build:
      context: .
      dockerfile: _docker/app/Dockerfile
    working_dir: /var/www
    volumes:
      - ./:/var/www/
    depends_on:
      api_db:
        condition: service_healthy

  api_nginx:
    image: nginx:1.29-alpine
    volumes:
      - ./_docker/nginx/conf.d/:/etc/nginx/conf.d/:ro
      - ./:/var/www/:ro
    ports:
      - "8080:80"
    depends_on:
      - api_app

  api_node:
    image: node:22-bookworm-slim
    working_dir: /var/www
    init: true
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./:/var/www/
      - node_modules:/var/www/node_modules
    ports:
      - "5173:5173"

  api_db:
    image: mysql:8.4
    restart: always
    volumes:
      - api_database:/var/lib/mysql
    environment:
      MYSQL_DATABASE: api_database
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "127.0.0.1:8101:3306"
    command: mysqld --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  adminer:
    image: adminer:5
    restart: always
    environment:
      ADMINER_DEFAULT_SERVER: api_db
    ports:
      - "127.0.0.1:8086:8080"
    depends_on:
      api_db:
        condition: service_healthy

volumes:
  api_database:
  node_modules:
